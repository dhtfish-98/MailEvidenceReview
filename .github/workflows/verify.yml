name: offline-evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.3.0 setuptools==82.0.1 wheel==0.48.0
      - run: python -m build --no-isolation
      - run: python -m pip install --no-index --no-deps dist/*.whl
      - run: cd /tmp && python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
